apiVersion: apps/v1
kind: Deployment
metadata:
  name: estela-api
  namespace: estela
  labels:
    app: estela-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: estela-api
  template:
    metadata:
      labels:
        app: estela-api
    spec:
      serviceAccountName: estela-deployer
      containers:
        - name: api
          image: bitmaker/estela-api:latest
          command:
            - /bin/sh
            - -ce
            - |
              python manage.py migrate --noinput
              gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: "config.settings.prod"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: estela-secrets
                  key: secret-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: estela-secrets
                  key: database-url
            - name: REDIS_URL
              value: "redis://estela-redis:6379/0"
            - name: RUNNING_IN_KUBERNETES
              value: "True"
            - name: JOB_NAMESPACE
              value: "estela"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: estela-api
  namespace: estela
  labels:
    app: estela-api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: estela-api
