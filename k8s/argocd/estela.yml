apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: estela
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/AobaIwaki123/lumiscrape'
    targetRevision: main
    path: k8s/estela
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: estela
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
