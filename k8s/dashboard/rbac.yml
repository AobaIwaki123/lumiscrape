apiVersion: v1
kind: ServiceAccount
metadata:
  name: lumiscrape-dashboard
  namespace: minio
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lumiscrape-job-manager
  namespace: minio
rules:
  - apiGroups: ["", "batch"]
    resources: ["pods", "pods/log", "jobs", "jobs/status", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lumiscrape-job-manager-binding
  namespace: minio
subjects:
  - kind: ServiceAccount
    name: lumiscrape-dashboard
    namespace: minio
roleRef:
  kind: Role
  name: lumiscrape-job-manager
  apiGroup: rbac.authorization.k8s.io
