name: Build & Publish Container Image

on:
  push:
    branches:
      - main
      - release
      - 'release-stage/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build & Push OCI Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Release Version Tag
        id: version
        run: |
          git fetch --tags origin || true
          
          BRANCH_NAME="${{ github.head_ref }}"
          if [ -z "$BRANCH_NAME" ]; then
            BRANCH_NAME="${{ github.ref_name }}"
          fi
          
          echo "Branch/Ref name: ${BRANCH_NAME}"
          
          if [[ "$BRANCH_NAME" =~ release-stage/v?([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            TAG="v${BASH_REMATCH[1]}"
          elif [[ "$BRANCH_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            TAG="v${BRANCH_NAME#v}"
          else
            PREV_TAG=$(git tag -l 'v*' | sort -V | tail -n 1)
            if [ -z "$PREV_TAG" ]; then
              PREV_TAG="v1.0.0"
            fi
            CLEAN_VER=$(echo "$PREV_TAG" | sed -E 's/^(lumiscrape-)?v?//')
            MAJOR=$(echo "$CLEAN_VER" | cut -d. -f1)
            MINOR=$(echo "$CLEAN_VER" | cut -d. -f2)
            NEXT_MINOR=$((MINOR + 1))
            TAG="v${MAJOR}.${NEXT_MINOR}.0"
          fi
          
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Calculated container release tag: ${TAG}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/release' || startsWith(github.head_ref, 'release-stage/') || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=release,enable=${{ github.ref == 'refs/heads/release' || startsWith(github.head_ref, 'release-stage/') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
