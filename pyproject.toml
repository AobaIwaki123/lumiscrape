[project]
name = "lumiscrape"
version = "1.0.0"
description = "Thin, robust, and LLM-assisted web scraping and data integration platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Aoba Iwaki" }
]
dependencies = [
    "scrapy>=2.11.0",
    "pydantic>=2.7.0",
    "minio>=7.2.0",
    "psycopg[binary]>=3.1.18",
    "crawl4ai>=0.3.0",
    "google-genai>=0.1.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "jinja2>=3.1.3",
    "kubernetes>=29.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.9.0",
    "ruff>=0.4.0",
    "types-PyYAML>=6.0.12",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/infrastructure", "src/scrapers", "src/dashboard"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["core", "infrastructure", "scrapers", "dashboard"]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "scrapy.*",
    "crawl4ai.*",
    "minio.*",
    "google.*",
    "psycopg.*",
    "numpy.*",
    "kubernetes.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
